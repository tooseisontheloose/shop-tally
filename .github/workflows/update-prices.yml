name: Update Aldi prices

on:
  schedule:
    - cron: "17 5 * * 5"   # every Friday about 6am UK summer time, 5am winter (GitHub uses UTC)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look up prices
        run: node scripts/update-prices.mjs
      - name: Save new prices
        run: |
          if [ -z "$(git status --porcelain prices.json catalogue.json)" ]; then
            echo "No changes this week."
          else
            git config user.name "shop-tally-bot"
            git config user.email "shop-tally-bot@users.noreply.github.com"
            git add prices.json
            if [ -f catalogue.json ]; then git add catalogue.json; fi
            git commit -m "Weekly Aldi prices and range"
            git push
          fi
